name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" ruff build
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - name: Smoke test
        run: |
          uvicorn commerceerp.api:app --host 127.0.0.1 --port 8000 &
          PID=$!
          sleep 3
          bash scripts/smoke.sh
          kill $PID
